<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Grand Prix - TB Racers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --display-font: 'Barlow Condensed', 'Segoe UI', Arial, sans-serif; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #2c3e50; color: #ecf0f1; margin: 0; padding: 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 20px; }
        .hero { width: 100%; margin-bottom: 30px; background-color: #111827; box-shadow: 0 4px 18px rgba(0,0,0,0.35); }
        .hero img { width: 100%; height: auto; display: block; }

        .site-nav {
            background: rgba(17, 24, 39, 0.96);
            border-top: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 4px 14px rgba(0,0,0,0.22);
        }
        .site-nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 11px 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            flex-wrap: wrap;
        }
        .nav-link {
            display: inline-block;
            color: #bdc3c7;
            font-weight: 800;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            border-bottom: 2px solid transparent;
            padding: 3px 0;
        }
        .nav-link:hover {
            text-decoration: none;
            color: #ffffff;
            border-bottom-color: #f1c40f;
        }
        .nav-link.active {
            color: #ffffff;
            border-bottom-color: #e74c3c;
        }
        table { width: 100%; border-collapse: collapse; background-color: #34495e; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 30px; }
        #leaderboard-table th:nth-child(1), #leaderboard-table td:nth-child(1) { width: 44px; }
        #leaderboard-table th:nth-child(3), #leaderboard-table td:nth-child(3) { width: 110px; }
        #leaderboard-table th:nth-child(4), #leaderboard-table td:nth-child(4) { width: 115px; }
        #leaderboard-table th:nth-child(7), #leaderboard-table td:nth-child(7) { width: 90px; text-align: right; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #4a6278; }
        th { background-color: #e74c3c; color: white; font-weight: bold; }
        tr:hover { background-color: #3d566b; }
        .km { font-weight: bold; color: #2ecc71; }
        .lap { display: block; margin-top: 3px; font-size: 12px; font-weight: 600; color: #f1c40f; }
        .gap { font-weight: bold; color: #f1c40f; white-space: nowrap; }
        .gap-leader { color: #2ecc71; }
        .nickname { display: block; margin-top: 3px; font-size: inherit; font-weight: 600; color: #dfe6e9; }
        .driver-poster-trigger {
            cursor: pointer;
            border-bottom: 1px dotted rgba(241, 196, 15, 0.75);
        }
        .driver-poster-trigger:hover {
            color: #f1c40f;
        }
        .driver-poster-preview {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9999;
            display: none;
            width: min(270px, 44vw);
            max-height: 78vh;
            padding: 8px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(241, 196, 15, 0.45);
            box-shadow: 0 14px 45px rgba(0,0,0,0.75);
        }
        .driver-poster-preview.visible {
            display: block;
        }
        .driver-poster-preview img {
            display: block;
            width: 100%;
            max-height: calc(78vh - 54px);
            object-fit: contain;
            border-radius: 10px;
            background: #111827;
        }
        .driver-poster-caption {
            margin-top: 6px;
            color: #ecf0f1;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }
        .driver-poster-close {
            display: none;
            position: absolute;
            top: 7px;
            right: 7px;
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 999px;
            background: rgba(0,0,0,0.72);
            color: #fff;
            font-size: 20px;
            line-height: 28px;
            cursor: pointer;
        }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
        #map { height: 500px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 30px; }
        .last-updated { text-align: center; font-style: italic; color: #bdc3c7; margin-bottom: 20px; }
        .race-title {
            text-align: center;
            margin: 0 0 8px;
            font-family: var(--display-font);
            font-size: clamp(3.2rem, 8vw, 5.8rem);
            font-weight: 800;
            font-style: italic;
            line-height: 0.9;
            color: #f1c40f;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 3px 4px 0 rgba(0,0,0,0.32);
        }
        .race-subtitle {
            text-align: center;
            margin: 0 0 18px;
            color: #bdc3c7;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .race-status {
            max-width: 760px;
            margin: 0 auto 22px;
            padding: 14px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(231,76,60,0.20), rgba(15,23,42,0.72));
            border: 1px solid rgba(241,196,15,0.35);
            box-shadow: 0 6px 22px rgba(0,0,0,0.22);
            text-align: center;
        }
        .race-status strong {
            display: block;
            margin-bottom: 4px;
            font-family: var(--display-font);
            font-size: clamp(1.9rem, 4vw, 2.8rem);
            font-weight: 800;
            font-style: italic;
            line-height: 0.9;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #f1c40f;
            text-shadow: 2px 3px 0 rgba(0,0,0,0.28);
        }
        .race-status span {
            color: #dfe6e9;
            font-size: 0.98rem;
        }
        h2 {
            font-family: var(--display-font);
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 800;
            font-style: italic;
            letter-spacing: 1px;
            line-height: 0.95;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 2px 3px 0 rgba(0,0,0,0.25);
            margin: 24px 0 14px;
        }

        #track-container {
            position: relative; width: min(960px, 100%); aspect-ratio: 1536 / 1024; margin: 0 auto 30px auto;
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            background-size: 104%; background-position: center; background-repeat: no-repeat;
            background-color: #111827;
        }
        .track-car {
            position: absolute;
            width: clamp(24px, 5vw, 48px);
            height: clamp(14px, 2.8vw, 27px);
            z-index: 10;
            transform-origin: 50% 50%;
            filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.85));
        }
        .track-car svg,
        .track-car img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .track-car.custom-svg-car {
            width: clamp(38px, 5.8vw, 54px);
            height: clamp(38px, 5.8vw, 54px);
        }

        .track-car.custom-svg-car img {
            object-fit: contain;
            transform: rotate(90deg) scale(0.98);
            transform-origin: 50% 50%;
        }
        .track-label { 
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 6px 16px;
            }

            h2 {
                font-size: 1.8rem;
                margin: 16px 0 10px;
            }

            .race-title {
                font-size: 3.2rem;
            }

            .site-nav-inner {
                padding: 9px 10px;
                gap: 13px;
                justify-content: flex-start;
            }

            .nav-link {
                font-size: 0.78rem;
                padding: 3px 0;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px 6px;
            }

            .lap {
                font-size: 10px;
            }

            .gap {
                font-size: 11px;
            }

            .nickname {
                font-size: inherit;
            }

            .driver-poster-preview {
                width: min(230px, 72vw);
                max-height: 70vh;
            }

            .driver-poster-preview img {
                max-height: calc(70vh - 54px);
            }

            .driver-poster-close {
                display: block;
            }

            #map {
                height: 360px;
                border-radius: 12px;
            }

            #track-container {
                width: 100%;
                margin-bottom: 22px;
                border-radius: 10px;
            }

            .track-car {
                width: 5vw;
                height: 2.8vw;
                min-width: 18px;
                min-height: 10px;
                max-width: 24px;
                max-height: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="images/race-banner.jpg" alt="TB Racers Race Banner">
    </div>

    <nav class="site-nav" aria-label="Main navigation">
        <div class="site-nav-inner">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="geograndprix.html">Geo Grand Prix</a>
            <a class="nav-link" href="test-race.html">Test Race</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="race-title">Geo Grand Prix 2026</h1>
        <p class="race-subtitle">Official TB-RACE</p>

        <div class="race-status">
            <strong>Green Flag!</strong>
            <span>The TB-RACERS Geo Grand Prix has officially started.</span>
        </div>

        <div class="last-updated">Last updated: <span id="last-updated">Loading...</span></div>

        <h2>Leaderboard</h2>
        <table id="leaderboard-table">
            <thead>
                <tr>
                    <th>#</th><th>Car</th><th>Owner</th><th>TB Reference</th><th>Cache</th><th>Distance</th><th>Gap</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h2>Track Positions</h2>
        <div id="track-container" style="background-image: url('images/geograndprix1.png');"></div>

        <h2>Live Map</h2>
        <div id="map"></div>
    </div>

    <div id="driver-poster-preview" class="driver-poster-preview" aria-hidden="true">
        <button type="button" class="driver-poster-close" aria-label="Close driver poster">×</button>
        <img src="" alt="">
        <div class="driver-poster-caption"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="racing-line-geograndprix.js"></script>
    <script>
        function updateTrackPositions(racers) {
            const container = document.getElementById('track-container');
            container.innerHTML = '';

            if (typeof racingLine === 'undefined' || !Array.isArray(racingLine) || racingLine.length === 0) {
                console.error('racing-line-geograndprix.js is missing or racingLine is empty.');
                return;
            }

            const TRACK_IMAGE_WIDTH = 1536;
            const TRACK_IMAGE_HEIGHT = 1024;

            function getDisplayPoint(trackPoint) {
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;

                const scale = Math.min(
                    containerWidth / TRACK_IMAGE_WIDTH,
                    containerHeight / TRACK_IMAGE_HEIGHT
                );

                const displayedWidth = TRACK_IMAGE_WIDTH * scale;
                const displayedHeight = TRACK_IMAGE_HEIGHT * scale;
                const offsetX = (containerWidth - displayedWidth) / 2;
                const offsetY = (containerHeight - displayedHeight) / 2;

                return {
                    x: offsetX + trackPoint[0] * scale,
                    y: offsetY + trackPoint[1] * scale
                };
            }

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function getCarColor(racer, index) {
                // Prefer the fixed colour from racers.json.
                // This prepares the site for official cars like Yellow 1, Green 5, etc.
                const colors = ['#8e44ad', '#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#e67e22', '#1abc9c', '#95a5a6'];
                return racer.color || colors[index % colors.length];
            }

            function getRaceCarSvg(color) {
                return `
                    <svg viewBox="0 0 64 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <!-- Simple TB-RACE top-view car, based on Kevin's 3D printed model. Nose points right. -->
                        <g stroke="#07111f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
                            <rect x="7" y="3" width="12" height="8" rx="2" fill="#111827"/>
                            <rect x="7" y="25" width="12" height="8" rx="2" fill="#111827"/>
                            <rect x="45" y="3" width="12" height="8" rx="2" fill="#111827"/>
                            <rect x="45" y="25" width="12" height="8" rx="2" fill="#111827"/>

                            <path d="M8 18 L15 7 L43 5 L57 12 L61 18 L57 24 L43 31 L15 29 Z" fill="${color}"/>
                            <path d="M39 8 L55 14 L58 18 L55 22 L39 28 L46 18 Z" fill="#ffffff" opacity="0.14" stroke="none"/>
                            <path d="M23 10 L35 11 L40 18 L35 25 L23 26 L18 18 Z" fill="#0f172a" opacity="0.38"/>
                            <path d="M4 12 L8 12 L8 24 L4 24 Z" fill="${color}"/>
                            <path d="M57 10 L62 10 M57 26 L62 26"/>

                            <circle cx="23" cy="13" r="1.8" fill="#d1d5db" opacity="0.85" stroke="none"/>
                            <circle cx="29" cy="13" r="1.8" fill="#d1d5db" opacity="0.85" stroke="none"/>
                            <circle cx="23" cy="18" r="1.8" fill="#d1d5db" opacity="0.85" stroke="none"/>
                            <circle cx="29" cy="18" r="1.8" fill="#d1d5db" opacity="0.85" stroke="none"/>
                            <circle cx="23" cy="23" r="1.8" fill="#d1d5db" opacity="0.85" stroke="none"/>
                            <circle cx="29" cy="23" r="1.8" fill="#d1d5db" opacity="0.85" stroke="none"/>

                            <path d="M10 18 L17 18" opacity="0.45"/>
                            <path d="M52 18 L60 18" opacity="0.45"/>
                        </g>
                    </svg>
                `;
            }

            const customCarImages = {
                1: 'images/tb-racers-car-blue-1.svg',
                2: 'images/tb-racers-car-yellow-2.svg',
                3: 'images/tb-racers-car-red-3.svg',
                5: 'images/tb-racers-car-black-5.svg',
                6: 'images/tb-racers-car-white-6.svg',
                7: 'images/tb-racers-car-orange-7.svg',
                8: 'images/tb-racers-car-green-8.svg',
                9: 'images/tb-racers-car-darkgreen-9.svg',
                10: 'images/tb-racers-car-gold-10.svg',
                11: 'images/tb-racers-car-purple-11.svg'
            };

            function getCustomCarImage(racer) {
                return racer.image || customCarImages[Number(racer.race_number)] || '';
            }

            function getRaceCarMarkup(racer, index) {
                const customImage = getCustomCarImage(racer);

                if (customImage) {
                    return `<img src="${customImage}" alt="${racer.car || 'TB-RACERS car'}">`;
                }

                return getRaceCarSvg(getCarColor(racer, index));
            }

            // Temporary test mode:
            // true  = place all cars on the staggered start grid, even if they already have km.
            // false = only cars with 0 km are placed on the start grid.
            const FORCE_START_GRID_TEST = false;

            function getStartGridPosition(racer, index) {
                const startPoint = getDisplayPoint(racingLine[0]);

                // Use the visible start order for the grid slot.
                // Race numbers may skip a number (for example no #4), but the grid itself should stay compact.
                const gridIndex = index;

                // TB-RACE staggered start grid, kept deliberately narrow:
                // 1
                //    2
                // 3
                //    4
                // 5
                //
                // On this track the start/finish straight is visually horizontal.
                // Using a fixed horizontal grid line keeps 1, 3, 5, 7, 9 neatly aligned.
                const gridDirectionX = 1;
                const gridDirectionY = 0;

                // Odd numbers stay on the main grid line.
                // Even numbers are shifted only a little lower, so the grid stays compact.
                const isEvenSlot = gridIndex % 2 === 1;

                // Keep the accepted desktop grid unchanged, but use a much tighter
                // proportional grid on small screens. The old fixed minimums (20/18/12px)
                // were too large on mobile and pushed the last cars off the straight.
                const isMobileGrid = container.clientWidth <= 600;

                const rowSpacing = isMobileGrid
                    ? Math.max(10, Math.min(13, container.clientWidth * 0.032))
                    : Math.max(20, Math.min(28, container.clientWidth * 0.026));

                const evenSideOffset = isMobileGrid
                    ? Math.max(10, Math.min(14, container.clientWidth * 0.033))
                    : Math.max(18, Math.min(28, container.clientWidth * 0.028));

                const backOffset = isMobileGrid
                    ? Math.max(7, Math.min(10, container.clientWidth * 0.022))
                    : Math.max(12, Math.min(22, container.clientWidth * 0.020));

                // Geo Grand Prix tuning:
                // The clicked racing-line start point is already close to the upper row.
                // Use only a small downward correction so both rows stay on the main straight.
                const gridDrop = isMobileGrid
                    ? 0
                    : Math.max(1, Math.min(5, container.clientWidth * 0.005 - 1));

                return {
                    x: startPoint.x + gridDirectionX * (backOffset + gridIndex * rowSpacing),
                    y: startPoint.y + gridDrop + gridDirectionY * (backOffset + gridIndex * rowSpacing) + (isEvenSlot ? evenSideOffset : 0),
                    angle: 0
                };
            }

            // Build a continuous path from the clicked racing-line points.
            // This avoids "snapping" to one point per ~40 km at the start of the race.
            const trackSegments = [];
            let totalTrackLength = 0;

            for (let i = 0; i < racingLine.length; i++) {
                const start = racingLine[i];
                const end = racingLine[(i + 1) % racingLine.length];
                const dx = end[0] - start[0];
                const dy = end[1] - start[1];
                const length = Math.hypot(dx, dy);

                if (length > 0) {
                    trackSegments.push({
                        start,
                        end,
                        length,
                        startDistance: totalTrackLength
                    });
                    totalTrackLength += length;
                }
            }

            function getTrackPositionAtProgress(progress) {
                const wrappedProgress = ((progress % 1) + 1) % 1;
                const targetDistance = wrappedProgress * totalTrackLength;

                let segment = trackSegments[trackSegments.length - 1];

                for (const candidate of trackSegments) {
                    if (targetDistance <= candidate.startDistance + candidate.length) {
                        segment = candidate;
                        break;
                    }
                }

                const distanceIntoSegment = targetDistance - segment.startDistance;
                const t = clamp(distanceIntoSegment / segment.length, 0, 1);

                const rawPoint = [
                    segment.start[0] + (segment.end[0] - segment.start[0]) * t,
                    segment.start[1] + (segment.end[1] - segment.start[1]) * t
                ];

                const point = getDisplayPoint(rawPoint);
                const startDisplay = getDisplayPoint(segment.start);
                const endDisplay = getDisplayPoint(segment.end);

                const tangentX = endDisplay.x - startDisplay.x;
                const tangentY = endDisplay.y - startDisplay.y;
                const tangentLength = Math.hypot(tangentX, tangentY) || 1;

                return {
                    point,
                    tangentX,
                    tangentY,
                    tangentLength
                };
            }

            // Cars are first placed at their exact race position.
            // Nearby cars get only a small sideways lane offset.
            // The km / longitudinal race position itself never changes.
            const placedTrackCars = [];

            // Pre-count exact 0.1 km groups so both members of an equal-km pair can use
            // the same wider two-lane spacing from the moment the first one is drawn.
            const distanceGroupTotals = {};
            racers.forEach(racer => {
                const d = (racer.km || 0) % KM_PER_LAP;
                if (d > 0) {
                    const key = String(Math.round(d * 10) / 10);
                    distanceGroupTotals[key] = (distanceGroupTotals[key] || 0) + 1;
                }
            });

            racers.forEach((racer, index) => {
                const distance = racer.km || 0;
                const isOnStartGrid = FORCE_START_GRID_TEST || distance === 0;

                let x;
                let y;
                let angle;

                if (isOnStartGrid) {
                    const gridPosition = getStartGridPosition(racer, index);
                    x = gridPosition.x;
                    y = gridPosition.y;
                    angle = gridPosition.angle;
                } else {
                    // Use the distance inside the current lap for the track position.
                    // The leaderboard still sorts by total km, but the car position loops every 5000 km.
                    const distanceInCurrentLap = distance % KM_PER_LAP;
                    const progress = distanceInCurrentLap / KM_PER_LAP;

                    // Continuous interpolation along the full racing line.
                    // A racer at 8.5 km is therefore really ahead of one at 1.4 km,
                    // instead of both being snapped to racingLine[0].
                    const trackPosition = getTrackPositionAtProgress(progress);
                    const point = trackPosition.point;
                    const tangentX = trackPosition.tangentX;
                    const tangentY = trackPosition.tangentY;
                    const tangentLength = trackPosition.tangentLength;

                    // Fine-tune the visual car position for the SVG cars.
                    // The racing line itself stays unchanged; only the drawn car is nudged a little.
                    // Bottom straight was good; top straight is moved slightly back down.
                    const trackCenterY = container.clientHeight / 2;
                    const verticalTrackOffset = Math.max(3, Math.min(6, container.clientWidth * 0.006));
                    const topStraightOffset = Math.max(1, Math.min(2, container.clientWidth * 0.002));
                    const visualOffsetY = point.y < trackCenterY ? topStraightOffset : verticalTrackOffset;

                    const normalX = -tangentY / tangentLength;
                    const normalY = tangentX / tangentLength;

                    // Compact two-lane overlap handling:
                    // Keep a tight racing pack inside the asphalt instead of fanning cars
                    // out into 3 or 4 lanes. Cars alternate between two small lateral lanes.
                    // When more than two cars are close together, the next pair is nudged
                    // slightly backwards along the racing line. Because racers are processed
                    // leader-first, this never makes a trailing car look further ahead.
                    const isMobileTrack = container.clientWidth <= 600;
                    // Treat a slightly larger area as one pack, so cars that are close on the
                    // start straight join the same compact group instead of partially overlapping.
                    const nearbyThreshold = isMobileTrack ? 30 : 52;

                    // Keep the pack narrow enough to stay on the asphalt, but give each pair just a bit
                    // more lateral breathing room so the cars don't visually merge.
                    const laneOffset = isMobileTrack ? 5 : 7;

                    // Push the next pair a little further back so stacked cars read as separate rows.
                    const rowSpacing = isMobileTrack ? 23 : 44;

                    const nearbyCars = placedTrackCars.filter(other => {
                        return Math.hypot(point.x - other.baseX, point.y - other.baseY) < nearbyThreshold;
                    });

                    // Version 5.15: equal-distance cars form one visual distance group.
                    // Two cars on exactly the same km should sit mainly side-by-side instead of
                    // the second car being pushed a full row backwards. Different km groups still
                    // use the staggered longitudinal spacing that keeps the track readable.
                    const distanceKey = String(Math.round(distanceInCurrentLap * 10) / 10);
                    const sameDistanceCars = nearbyCars.filter(other => other.distanceKey === distanceKey);
                    const otherDistanceGroups = new Set(
                        nearbyCars
                            .filter(other => other.distanceKey !== distanceKey)
                            .map(other => other.distanceKey)
                    );

                    const nearbyGroupCount = otherDistanceGroups.size;
                    const sameDistanceIndex = sameDistanceCars.length;
                    const distanceGroupTotal = distanceGroupTotals[distanceKey] || 1;
                    const isEqualDistanceGroup = distanceGroupTotal > 1;

                    // First two equal-km cars share the same longitudinal position and use opposite
                    // narrow lanes. If three or more ever share the same km, additional pairs get a
                    // modest extra row rather than stacking directly on top of each other.
                    let laneSide;
                    if (sameDistanceIndex === 0) {
                        laneSide = nearbyGroupCount % 2 === 0 ? 1 : -1;
                    } else {
                        const firstSameLane = sameDistanceCars[0].laneSide || 1;
                        laneSide = sameDistanceIndex % 2 === 1 ? -firstSameLane : firstSameLane;
                    }

                    const equalKmLaneOffset = isMobileTrack ? 9 : 15;
                    const sidewaysOffset = laneSide * (isEqualDistanceGroup ? equalKmLaneOffset : laneOffset);
                    const equalKmExtraRow = Math.floor(sameDistanceIndex / 2) * (isMobileTrack ? 14 : 24);

                    // Soft stagger for equal-km pairs: keep them broadly side-by-side, but give the
                    // second car in the pair a tiny extra rearward offset so the result reads less
                    // like a pile-up when two equal-km pairs are close to each other.
                    const equalKmMicroStagger = (isEqualDistanceGroup && (sameDistanceIndex % 2 === 1))
                        ? (isMobileTrack ? 6 : 14)
                        : 0;

                    // If an equal-km pair sits behind one or more other local distance groups,
                    // push that whole pair a bit further back. This specifically helps cases like
                    // Black 5 / Gold 10, which otherwise still look too bunched into the group ahead.
                    const trailingEqualGroupShift = (isEqualDistanceGroup && nearbyGroupCount >= 2)
                        ? (isMobileTrack ? 6 : 12)
                        : 0;

                    // Fine-tune Black 5 when it shares an equal-km group: the first car in an
                    // equal pair otherwise sits slightly further forward than its partner.
                    // A small extra rearward nudge lines Black 5 up more closely with Gold 10
                    // and keeps it off the rear of Green 8.
                    const black5RearNudge = (
                        isEqualDistanceGroup &&
                        Number(racer.race_number) === 5 &&
                        sameDistanceIndex === 0
                    ) ? (isMobileTrack ? 5 : 10) : 0;

                    // Version 5.21: keep the proven 5.19 pack logic and only fine-tune
                    // Purple 11 when it is part of a very-low-km equal-distance pair.
                    // Give Purple a small extra rearward nudge so it does not visually
                    // jump ahead or sit too tightly on Red 3.
                    const purple11RearNudge = (
                        isEqualDistanceGroup &&
                        Number(racer.race_number) === 11 &&
                        distanceInCurrentLap <= 30
                    ) ? (isMobileTrack ? 6 : 12) : 0;

                    // Version 5.22: Red 3 is the first member of the current 16 km pair.
                    // Give it a small rearward nudge as well, so it clears the car ahead
                    // while still staying slightly in front of Purple 11.
                    const red3RearNudge = (
                        isEqualDistanceGroup &&
                        Number(racer.race_number) === 3 &&
                        distanceInCurrentLap <= 30
                    ) ? (isMobileTrack ? 4 : 8) : 0;

                    const backwardOffset = nearbyGroupCount * rowSpacing
                        + equalKmExtraRow
                        + equalKmMicroStagger
                        + trailingEqualGroupShift
                        + black5RearNudge
                        + purple11RearNudge
                        + red3RearNudge;
                    const nearbyCount = nearbyCars.length;

                    const unitTangentX = tangentX / tangentLength;
                    const unitTangentY = tangentY / tangentLength;

                    // Version 5.3 tuning:
                    // keep the staggered pack, but shift the whole moving pack a bit further
                    // forward on the start straight so the km-cars sit beyond the start line.
                    // Also add a tiny extra sideways separation there so car 1 and car 2 read
                    // as distinct cars instead of nearly touching.
                    const isStartStraightZone = distanceInCurrentLap > 0 && distanceInCurrentLap <= 120;

                    // Smooth launch correction: cars close to the start still get a visual push,
                    // but that push fades as their real km increase. This prevents a 68 km car
                    // from visually catching a 123 km car just because one is below 120 km.
                    const launchFactor = isStartStraightZone
                        ? clamp((120 - distanceInCurrentLap) / 120, 0, 1)
                        : 0;

                    const forwardPackBias = (nearbyCount > 0)
                        ? (isMobileTrack ? 23 : 54) * launchFactor * launchFactor
                        : 0;
                    const effectiveBackwardOffset = Math.max(0, backwardOffset - forwardPackBias);

                    const startStraightForwardShift = (isMobileTrack ? 15 : 32) * launchFactor;
                    const startStraightLaneBonus = isStartStraightZone
                        ? (isMobileTrack ? 1 : 2)
                        : 0;
                    const adjustedSidewaysOffset = sidewaysOffset + laneSide * startStraightLaneBonus;

                    const leaderBreakawayShift = (nearbyCount === 0)
                        ? (isMobileTrack ? 8 : 22) * launchFactor
                        : 0;
                    const totalForwardShift = startStraightForwardShift + leaderBreakawayShift;

                    x = point.x
                        + normalX * adjustedSidewaysOffset
                        - unitTangentX * effectiveBackwardOffset
                        + unitTangentX * totalForwardShift;
                    y = point.y
                        + visualOffsetY
                        + normalY * adjustedSidewaysOffset
                        - unitTangentY * effectiveBackwardOffset
                        + unitTangentY * totalForwardShift;

                    // Small polishing tweak for the horizontal start straight:
                    // the upper lane was sitting a touch too high, especially for car 7.
                    // Nudge only that lane slightly downward without affecting the real track order.
                    if (isStartStraightZone && laneSide === 1) {
                        y += isMobileTrack ? 2 : 3;
                    }

                    // One extra tiny drop for the second moving car on the start straight
                    // (Yellow 2 in the current pack), so it sits a touch lower and overlaps
                    // less with Green 8.
                    if (isStartStraightZone && nearbyCount === 1) {
                        y += isMobileTrack ? 2 : 5;
                    }

                    // Version 5.23: White 6 currently sits in the very tight low-km pack.
                    // Bring only this car a little further toward the asphalt so the lateral
                    // stagger does not push it completely into the grass.
                    if (
                        isStartStraightZone &&
                        Number(racer.race_number) === 6 &&
                        distanceInCurrentLap <= 25
                    ) {
                        // White 6: move it BACKWARDS along the racing line so its
                        // visual position matches its very low KM value. Do not change
                        // its lateral lane position.
                        // Keep White 6 clearly at the very back of the low-km group.
                        // We also move it slightly DOWN on screen so its body stays on the asphalt.
                        // White 6 needs to sit clearly behind the rest of the low-km pack.
                        // Keep the same longitudinal direction, but increase the shift.
                        const white6RearwardShift = isMobileTrack ? 24 : 44;
                        x -= unitTangentX * white6RearwardShift;
                        y -= unitTangentY * white6RearwardShift;

                        const white6DownShift = isMobileTrack ? 10 : 18;
                        y += white6DownShift;
                    }

                    // If the leading car has already left the start-straight pack and is alone
                    // in the first sector after the line (Orange 7 in the current situation),
                    // nudge it a little upward so it doesn't sit visually underneath Blue 1.
                    const isOpeningSector = distanceInCurrentLap > 120 && distanceInCurrentLap <= 350;
                    if (isOpeningSector && nearbyCount === 0) {
                        y -= isMobileTrack ? 6 : 12;
                    }

                    placedTrackCars.push({
                        baseX: point.x,
                        baseY: point.y,
                        distanceKey,
                        laneSide
                    });

                    // The custom SVG cars point in the opposite direction of the
                    // racing-line tangent, so rotate the calculated tangent by 180 degrees.
                    // Without this correction, the first car that leaves the <=120 km
                    // start-straight override suddenly appears to drive backwards.
                    angle = Math.atan2(tangentY, tangentX) * 180 / Math.PI + 180;

                    // Keep very low km values perfectly horizontal on the start straight.
                    if (distanceInCurrentLap > 0 && distanceInCurrentLap <= 120) {
                        angle = 0;
                    }
                }

                const car = document.createElement('div');
                car.className = 'track-car';

                if (getCustomCarImage(racer)) {
                    car.classList.add('custom-svg-car');
                }

                car.style.left = `${Math.round(x)}px`;
                car.style.top = `${Math.round(y)}px`;
                car.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
                car.innerHTML = getRaceCarMarkup(racer, index);

                // If a custom SVG ever fails to load (for example because of a transient
                // browser/GitHub asset error), show the built-in race-car SVG instead of
                // displaying broken vertical alt text on the track.
                const carImage = car.querySelector('img');
                if (carImage) {
                    carImage.addEventListener('error', () => {
                        car.classList.remove('custom-svg-car');
                        car.innerHTML = getRaceCarSvg(getCarColor(racer, index));
                    }, { once: true });
                }

                container.appendChild(car);

            });
        }


        function getCacheDisplay(racer) {
            if (racer.status === 'in_hands') {
                return racer.location || 'In the hands of a geocacher';
            }

            if (racer.cache) {
                return `<a href="https://www.geocaching.com/geocache/${racer.cache}" target="_blank">${racer.cache}</a>`;
            }

            return '-';
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getCarDisplay(racer) {
            const mainName = racer.car || racer.name || 'Unknown';
            const safeMainName = escapeHtml(mainName);
            const teamName = racer.nickname && racer.nickname !== mainName
                ? escapeHtml(racer.nickname)
                : '';

            const posterPath = racer.poster ? escapeHtml(racer.poster) : '';

            const nickname = teamName
                ? `<span class="nickname driver-poster-trigger" data-poster="${posterPath}" data-car="${safeMainName}" data-team="${teamName}">${teamName}</span>`
                : '';

            return `${safeMainName}${nickname}`;
        }

        function showDriverPoster(trigger) {
            const posterPath = trigger.dataset.poster;
            if (!posterPath) {
                return;
            }

            const preview = document.getElementById('driver-poster-preview');
            const image = preview.querySelector('img');
            const caption = preview.querySelector('.driver-poster-caption');

            image.src = posterPath;
            image.alt = `${trigger.dataset.car || 'Driver'} poster`;
            caption.textContent = `${trigger.dataset.car || ''} · ${trigger.dataset.team || ''}`.trim();

            preview.classList.add('visible');
            preview.setAttribute('aria-hidden', 'false');

            positionDriverPoster(trigger);
        }

        function positionDriverPoster(trigger) {
            const preview = document.getElementById('driver-poster-preview');
            const rect = trigger.getBoundingClientRect();
            const margin = 12;

            const previewWidth = preview.offsetWidth || 270;
            const previewHeight = preview.offsetHeight || 360;

            let left = rect.right + 16;
            let top = rect.top - 12;

            if (left + previewWidth > window.innerWidth - margin) {
                left = rect.left - previewWidth - 16;
            }

            if (left < margin) {
                left = Math.max(margin, (window.innerWidth - previewWidth) / 2);
            }

            if (top + previewHeight > window.innerHeight - margin) {
                top = window.innerHeight - previewHeight - margin;
            }

            if (top < margin) {
                top = margin;
            }

            preview.style.left = `${Math.round(left)}px`;
            preview.style.top = `${Math.round(top)}px`;
        }

        function hideDriverPoster() {
            const preview = document.getElementById('driver-poster-preview');
            const image = preview.querySelector('img');

            preview.classList.remove('visible');
            preview.setAttribute('aria-hidden', 'true');
            preview.dataset.locked = 'false';
            image.removeAttribute('src');
        }

        function setupDriverPosterPreview() {
            const preview = document.getElementById('driver-poster-preview');
            const closeButton = preview.querySelector('.driver-poster-close');

            document.querySelectorAll('.driver-poster-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', () => {
                    preview.dataset.locked = 'false';
                    showDriverPoster(trigger);
                });

                trigger.addEventListener('mouseleave', () => {
                    if (preview.dataset.locked !== 'true') {
                        hideDriverPoster();
                    }
                });

                trigger.addEventListener('focus', () => {
                    preview.dataset.locked = 'false';
                    showDriverPoster(trigger);
                });

                trigger.addEventListener('blur', () => {
                    if (preview.dataset.locked !== 'true') {
                        hideDriverPoster();
                    }
                });

                trigger.addEventListener('click', event => {
                    event.preventDefault();
                    event.stopPropagation();
                    preview.dataset.locked = 'true';
                    showDriverPoster(trigger);
                });
            });

            closeButton.addEventListener('click', event => {
                event.stopPropagation();
                hideDriverPoster();
            });

            document.addEventListener('click', event => {
                if (!preview.contains(event.target) && !event.target.classList.contains('driver-poster-trigger')) {
                    hideDriverPoster();
                }
            });

            window.addEventListener('resize', hideDriverPoster);
            window.addEventListener('scroll', () => {
                if (preview.dataset.locked !== 'true') {
                    hideDriverPoster();
                }
            }, true);
        }

        const KM_PER_LAP = 5000;

        function getLap(km) {
            return Math.floor((km || 0) / KM_PER_LAP) + 1;
        }

        function formatKm(value) {
            const rounded = Math.round((value || 0) * 10) / 10;
            return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
        }

        function getGapDisplay(racer, leaderKm, index) {
            if (index === 0) {
                return '<span class="gap gap-leader">Leader</span>';
            }

            const gap = leaderKm - (racer.km || 0);
            return `<span class="gap">${formatKm(gap)} km</span>`;
        }

        async function loadRaceData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/GamesAtTheGarage/TB-RACE/main/racers-geograndprix.json');
                const racers = await response.json();

                // Sort the leaderboard and track positions by distance, highest km first.
                racers.sort((a, b) => (b.km || 0) - (a.km || 0));

                document.getElementById('last-updated').textContent = racers[0]?.last_updated 
                    ? new Date(racers[0].last_updated).toLocaleString() 
                    : 'Just now';

                const leaderKm = racers[0]?.km || 0;
                const tbody = document.querySelector('#leaderboard-table tbody');
                tbody.innerHTML = '';
                racers.forEach((racer, i) => {
                    const row = document.createElement('tr');
                    const racerKm = racer.km || 0;
                    row.innerHTML = `
                        <td>#${i+1}</td>
                        <td>${getCarDisplay(racer)}</td>
                        <td>${racer.owner || ''}</td>
                        <td><a href="https://www.geocaching.com/track/details.aspx?tracker=${racer.reference}" target="_blank">${racer.reference}</a></td>
                        <td>${getCacheDisplay(racer)}</td>
                        <td class="km">${formatKm(racerKm)} km<span class="lap">Lap ${getLap(racerKm)}</span></td>
                        <td>${getGapDisplay(racer, leaderKm, i)}</td>
                    `;
                    tbody.appendChild(row);
                });

                setupDriverPosterPreview();

                updateTrackPositions(racers);

                const map = L.map('map');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);

                const markerBounds = [];

                racers.forEach(racer => {
                    if (racer.coordinates && racer.coordinates.length === 2) {
                        const icon = L.divIcon({className: 'car-marker', html: '🚗', iconSize: [56,56], iconAnchor: [28,28]});
                        L.marker(racer.coordinates, {icon}).addTo(map)
                            .bindPopup(`<strong>${racer.car || racer.name}</strong><br>${racer.km || 0} km`);

                        markerBounds.push(racer.coordinates);
                    }
                });

                if (markerBounds.length > 0) {
                    map.fitBounds(markerBounds, {
                        padding: [60, 60],
                        maxZoom: 9
                    });
                } else {
                    map.setView([50.5, 7], 5.5);
                }

            } catch (e) {
                console.error(e);
            }
        }

        window.onload = loadRaceData;
    </script>
